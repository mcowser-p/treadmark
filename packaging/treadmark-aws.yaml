# treadmark-aws.yaml — example config for the AWS drift monitor.
#
# ⚠ DORMANT — the `treadmark aws` subcommand is currently unwired (scaffold
# pending real-account validation; see docs/cloud-workflow.md). Kept for
# when that validation lands.
#
# Requires the aws extra:   pip install "treadmark[aws]"
# Credentials come from the standard boto3 chain (profile below, or
# AWS_PROFILE / AWS_ACCESS_KEY_* env vars, or an instance/task role).
# All calls are read-only (Describe*/List*/Get*) — grant the SecurityAudit
# managed policy, or a minimal custom policy (see docs/cloud-workflow.md).
#
# Usage:
#   treadmark aws init  --config treadmark-aws.yaml            # capture the baseline
#   treadmark aws scan  --config treadmark-aws.yaml --report drift.sarif
#   treadmark aws update --config treadmark-aws.yaml           # accept current state

# One baseline DB per account. Keep it out of world-readable locations — it
# describes your security posture (it stores NO secrets: env var names only,
# no key material, no access-key secrets).
db_path: /var/lib/treadmark/aws-baseline.db

# Named profile from ~/.aws/config. Omit to use the default boto3 chain.
# aws_profile: prod

# Regions to scan. Omit (or leave commented) to scan every ENABLED region
# in the account (discovered via ec2:DescribeRegions).
# aws_regions:
#   - us-east-1
#   - eu-west-1

# Services to baseline. Omit to scan all shipped drivers (the curated
# "core /etc of AWS"). Narrow this to speed up scans or focus a review.
# aws_services:
#   - iam          # users, roles, policies, MFA, access-key metadata, pw policy
#   - s3           # bucket policy, public-access block, ACL, encryption
#   - ec2          # security groups, network ACLs, VPCs
#   - cloudtrail   # trails + IsLogging (tamper signal)
#   - kms          # customer keys, rotation status, key policy
#   - lambda       # function config, role, env var NAMES, resource policy

# Extra fields to treat as VOLATILE (stripped before diffing, at any depth),
# on top of the built-in list (last-used timestamps, delivery heartbeats,
# ResponseMetadata). Add here if a field in your account churns on its own
# and shows up as false drift.
# aws_volatile_fields:
#   - SomeTimestampField
