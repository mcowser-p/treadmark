# C:\ProgramData\Cairn\cairn.yaml — default config for Windows, edit before
# first run.
#
# This is the FILE half of cairn on Windows. The REGISTRY half (autoruns,
# services, Winlogon, policies) is monitored separately by `cairn registry`,
# which ships its own sensible default key list — run both:
#   cairn all init   --config C:\ProgramData\Cairn\cairn.yaml
#   cairn all scan   --config C:\ProgramData\Cairn\cairn.yaml
#
# The watch set below mirrors the Linux config's philosophy: cover the
# executable and persistence surfaces an attacker would touch, exclude the
# high-churn caches that would drown the signal.

db_path: C:\ProgramData\Cairn\baseline.db

paths:
  # Program binaries — where installed software (and dropped payloads) live
  - C:\Program Files
  - C:\Program Files (x86)

  # Hosts file: DNS redirection is a classic tamper (the Windows /etc/hosts)
  - C:\Windows\System32\drivers\etc

  # Scheduled tasks — a top-tier persistence mechanism (XML task definitions)
  - C:\Windows\System32\Tasks
  - C:\Windows\Tasks

  # Scheduled-task DEFINITIONS also register under drivers; the two Tasks
  # dirs above hold the XML. (Do NOT add all of System32 — see note below.)

  # Startup-folder persistence (per-machine and the shell startup tree)
  - C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup

  # --- Do you need C:\Windows\System32? Almost never in full. ---
  # It's tens of thousands of OS-owned files that churn on every Windows
  # Update — the Windows equivalent of watching all of /usr/lib on Linux.
  # The security-relevant parts are already covered above as targeted subdirs
  # (drivers\etc = hosts, Tasks = scheduled tasks). For driver-implant
  # detection, watch just the driver dir, not the whole tree:
  # - C:\Windows\System32\drivers      # .sys driver files (targeted, ~hundreds)
  #
  # Wider coverage (bigger baseline, slower scans) — uncomment deliberately:
  # - C:\Windows\System32              # ALL core OS binaries — big, update-churny
  # - C:\Users                         # per-user profiles: rc-equivalent + startup

exclude:
  # --- High-churn OS/state that changes on its own ---
  - C:\Windows\System32\config\        # live registry hives (use `cairn registry`)
  - C:\Windows\System32\LogFiles\
  - C:\Windows\System32\catroot2\      # code-signing catalog cache
  - C:\Windows\System32\spool\
  - C:\Windows\ServiceProfiles\
  - C:\Windows\Temp\
  - \Prefetch\
  - \WinSxS\                           # component store: enormous, churns on updates

  # --- Program Files churn: self-updaters, caches, and app runtime state.
  #     These are the count-inflaters on a real box — trim them hard so the
  #     Program Files baseline stays about installed binaries, not scratch. ---
  - \Update\
  - \Updates\
  - \cache\
  - \Cache\
  - \logs\
  - \Logs\
  - \Crashpad\                         # Chromium/Electron crash handler
  - \GPUCache\                         # Electron/browser render caches
  - \Code Cache\
  - \Service Worker\
  - \blob_storage\
  - node_modules                       # bundled JS dependency trees (huge)
  - __pycache__                        # Python bytecode
  - \NativeImages                      # .NET NGEN cache (regenerated, not authored)
  - \.git\                             # repos vendored into an install dir
  - \telemetry\

  # --- Package / installer bookkeeping ---
  - C:\ProgramData\Package Cache\      # MSI/bootstrapper cache
  - C:\Program Files\WindowsApps\      # Store apps: sealed, signed, churn

exclude_extensions:
  - .log
  - .tmp
  - .etl        # event trace logs
  - .evtx       # event logs
  - .pf         # prefetch
  - .dmp        # crash dumps
  - .pdb        # debug symbols — large, high-count, not a tamper target
  - .mui        # localized resource DLLs — many, static, low signal
  - .bak
  - .old

follow_symlinks: false
hash_algorithm: sha256
max_file_size_mb: 500

# Store gzipped content of small text files in the baseline so `cairn files
# scan` shows unified diffs of changed configs. On Windows the baseline DB is
# ACL-locked to Administrators/SYSTEM (see the MSI's DataDir permissions).
# Most Program Files content is binary, so content capture is smaller here
# than on a Linux /etc; still useful for the hosts file and text configs.
store_content: true
store_content_max_kb: 256

# Optional report output — see docs/output-formats.md.
# report:
#   path: C:\ProgramData\Cairn\reports\latest.json
#   format: json
