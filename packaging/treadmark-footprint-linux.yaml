# treadmark-footprint-linux.yaml
#
# Config for capturing an application's INSTALL FOOTPRINT on Linux.
#
# Workflow:
#   1. On a clean OS image, before the developer touches it:
#        treadmark files init --config treadmark-footprint-linux.yaml
#   2. Hand the box over. Developer installs their application.
#   3. Capture the footprint:
#        treadmark footprint --config treadmark-footprint-linux.yaml \
#                        --app myapp --report myapp-footprint.json
#
# The excludes below are tuned for this specific job: keep everything that
# tells you what the app installed; drop everything that changes on its own.
# This is a different exclude list than you'd use for forensic drift detection
# — here we tolerate missing some drift in exchange for a clean signal.

db_path: /var/lib/treadmark/clean-baseline.db

# ---------------------------------------------------------------------------
# What to watch. Broad on purpose — an installer can put files anywhere.
# ---------------------------------------------------------------------------
paths:
  # Configuration and system integration
  - /etc

  # Executables and libraries
  - /bin
  - /sbin
  - /usr/bin
  - /usr/sbin
  - /usr/local/bin
  - /usr/local/sbin
  - /usr/lib
  - /usr/lib64
  - /usr/libexec
  - /usr/local/lib
  - /lib
  - /lib64

  # Where third-party apps typically land
  - /opt
  - /srv
  - /usr/share

  # Persistent application state (installers create these)
  - /var/lib

  # Service and scheduling definitions live under /etc, already covered,
  # but user crontabs live here:
  - /var/spool/cron

  # Boot-time changes
  - /boot

  # Uncomment if developers are expected to install into a home directory,
  # or run ROOTLESS podman quadlets (~/.config/containers/systemd/) — /home
  # is required for rootless-quadlet capture and the linger_users list in
  # `footprint --access-vars` output:
  # - /home
  # - /root

# ---------------------------------------------------------------------------
# The chatty places. Everything here changes without an application doing
# anything, and would drown the footprint in noise.
# ---------------------------------------------------------------------------
exclude:
  # --- Package manager bookkeeping (huge, changes on every apt/dnf run) ---
  - /var/lib/dpkg/
  - /var/lib/apt/
  - /var/lib/rpm/
  - /var/lib/dnf/
  - /var/lib/yum/
  - /var/lib/PackageKit/
  - /var/lib/snapd/
  - /usr/share/doc/
  - /usr/share/man/
  - /usr/share/info/
  - /usr/share/locale/
  - /usr/share/zoneinfo/
  - /usr/share/mime/
  - /usr/share/icons/
  - /usr/share/fonts/
  - /usr/share/help/
  - /usr/share/backgrounds/

  # --- Caches and generated artifacts ---
  - /var/cache/
  - /var/lib/systemd/
  - /var/lib/dbus/machine-id
  - /var/lib/NetworkManager/
  - /var/lib/logrotate/
  - /var/lib/ucf/
  - /var/lib/update-notifier/
  - /var/lib/man-db/
  - /var/lib/command-not-found/
  - /var/lib/sudo/
  - /var/lib/polkit-1/
  - /var/lib/private/systemd/
  - __pycache__
  - /.cache/
  - node_modules

  # --- Runtime state (not install footprint) ---
  - /etc/mtab
  - /etc/resolv.conf          # rewritten by DHCP / systemd-resolved
  - /etc/hostname             # host-specific
  - /etc/machine-id
  - /etc/hosts                # often carries the host's own IP
  - /etc/adjtime              # NTP writes this
  - /etc/ld.so.cache          # regenerated by ldconfig, not authored
  - /etc/.pwd.lock
  - /etc/mtab.fuselock

  # --- Backup / temp files left by editors and package tools ---
  - .dpkg-old
  - .dpkg-new
  - .dpkg-dist
  - .rpmnew
  - .rpmsave
  - .ucf-old
  - .ucf-new
  - .bak
  - '~'

  # --- SSH host keys (regenerated per-host, not part of the app) ---
  - /etc/ssh/ssh_host_

  # --- Cloud-init and provisioning residue ---
  - /etc/cloud/
  - /var/lib/cloud/

  # --- Kernel and initramfs artifacts (huge, changes on kernel updates) ---
  - /boot/initrd
  - /boot/initramfs
  - /boot/vmlinuz
  - /boot/System.map
  - /usr/lib/modules/
  - /lib/modules/

  # --- Locale / terminfo / certificate bundles regenerated by triggers ---
  - /etc/ssl/certs/
  - /usr/share/ca-certificates/
  - /etc/ca-certificates/

  # --- systemd generated symlink farms (the unit file itself is what matters,
  #     not the .wants/ symlink; but we keep .wants under /etc for enablement
  #     signal — comment the next line out if it's too noisy) ---
  # - .wants/

  # --- Journal, logs (never install footprint) ---
  - /var/log/

exclude_extensions:
  - .log
  - .tmp
  - .swp
  - .swo
  - .pyc
  - .pyo
  - .gz          # rotated logs, compressed manpages
  - .journal
  - .lock
  - .pid

# ---------------------------------------------------------------------------
# Behavior
# ---------------------------------------------------------------------------
follow_symlinks: false
hash_algorithm: sha256
max_file_size_mb: 500

# REQUIRED for the footprint command to parse systemd units, cron files,
# /etc/passwd, /etc/group, and sudoers. Without stored content the semantic
# parsers have nothing to read from the baseline side of a diff.
store_content: true
store_content_max_kb: 512

# Note on privacy: with store_content on, the baseline DB holds snapshots of
# every small text file under the monitored paths — including /etc/shadow if
# it is readable. The DB is mode 0700 root-only. For footprint capture on a
# throwaway build VM this is fine; on a production host, consider whether the
# baseline DB itself needs to be treated as sensitive.
