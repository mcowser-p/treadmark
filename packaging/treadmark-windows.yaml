# C:\ProgramData\Treadmark\treadmark.yaml — default config for Windows, edit before
# first run.
#
# One config, both halves. `treadmark all` monitors the FILE surface (paths
# below) AND the REGISTRY surface (registry_keys below, which includes
# Windows services) from this single file:
#   treadmark all init   --config C:\ProgramData\Treadmark\treadmark.yaml
#   treadmark all scan   --config C:\ProgramData\Treadmark\treadmark.yaml
#
# The watch set mirrors the Linux config's philosophy: cover the executable,
# registry, and persistence surfaces an attacker would touch; exclude the
# high-churn caches that would drown the signal.

db_path: C:\ProgramData\Treadmark\baseline.db

paths:
  # Program binaries — where installed software (and dropped payloads) live
  - C:\Program Files
  - C:\Program Files (x86)

  # Hosts file: DNS redirection is a classic tamper (the Windows /etc/hosts)
  - C:\Windows\System32\drivers\etc

  # Scheduled tasks — a top-tier persistence mechanism (XML task definitions)
  - C:\Windows\System32\Tasks
  - C:\Windows\Tasks

  # Scheduled-task DEFINITIONS also register under drivers; the two Tasks
  # dirs above hold the XML. (Do NOT add all of System32 — see note below.)

  # Startup-folder persistence (per-machine and the shell startup tree)
  - C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup

  # --- Do you need C:\Windows\System32? Almost never in full. ---
  # It's tens of thousands of OS-owned files that churn on every Windows
  # Update — the Windows equivalent of watching all of /usr/lib on Linux.
  # The security-relevant parts are already covered above as targeted subdirs
  # (drivers\etc = hosts, Tasks = scheduled tasks). For driver-implant
  # detection, watch just the driver dir, not the whole tree:
  # - C:\Windows\System32\drivers      # .sys driver files (targeted, ~hundreds)
  #
  # Wider coverage (bigger baseline, slower scans) — uncomment deliberately:
  # - C:\Windows\System32              # ALL core OS binaries — big, update-churny
  # - C:\Users                         # per-user profiles: rc-equivalent + startup

exclude:
  # --- High-churn OS/state that changes on its own ---
  - C:\Windows\System32\config\        # live registry hives (use `treadmark registry`)
  - C:\Windows\System32\LogFiles\
  - C:\Windows\System32\catroot2\      # code-signing catalog cache
  - C:\Windows\System32\spool\
  - C:\Windows\ServiceProfiles\
  - C:\Windows\Temp\
  - \Prefetch\
  - \WinSxS\                           # component store: enormous, churns on updates

  # --- Program Files churn: self-updaters, caches, and app runtime state.
  #     These are the count-inflaters on a real box — trim them hard so the
  #     Program Files baseline stays about installed binaries, not scratch. ---
  - \Update\
  - \Updates\
  - \cache\
  - \Cache\
  - \logs\
  - \Logs\
  - \Crashpad\                         # Chromium/Electron crash handler
  - \GPUCache\                         # Electron/browser render caches
  - \Code Cache\
  - \Service Worker\
  - \blob_storage\
  - node_modules                       # bundled JS dependency trees (huge)
  - __pycache__                        # Python bytecode
  - \NativeImages                      # .NET NGEN cache (regenerated, not authored)
  - \.git\                             # repos vendored into an install dir
  - \telemetry\

  # --- Package / installer bookkeeping ---
  - C:\ProgramData\Package Cache\      # MSI/bootstrapper cache
  - C:\Program Files\WindowsApps\      # Store apps: sealed, signed, churn

exclude_extensions:
  - .log
  - .tmp
  - .etl        # event trace logs
  - .evtx       # event logs
  - .pf         # prefetch
  - .dmp        # crash dumps
  - .pdb        # debug symbols — large, high-count, not a tamper target
  - .mui        # localized resource DLLs — many, static, low signal
  - .bak
  - .old

follow_symlinks: false
hash_algorithm: sha256
max_file_size_mb: 500

# ---------------------------------------------------------------------------
# Registry surface — monitored by `treadmark registry` / `treadmark all`. These are
# the persistence, service, and auth keys an attacker touches. Declared here
# (rather than left to the built-in defaults) so you can see and tune them.
# ---------------------------------------------------------------------------
registry_keys:
  # --- Autoruns: the most-targeted persistence spots ---
  - HKLM\Software\Microsoft\Windows\CurrentVersion\Run
  - HKLM\Software\Microsoft\Windows\CurrentVersion\RunOnce
  - HKLM\Software\Microsoft\Windows\CurrentVersion\RunOnceEx
  - HKLM\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Run
  - HKLM\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\RunOnce
  - HKCU\Software\Microsoft\Windows\CurrentVersion\Run
  - HKCU\Software\Microsoft\Windows\CurrentVersion\RunOnce

  # --- Windows services: each service's config (ImagePath, Start, ObjectName
  #     = the run-as identity) lives here. This is how services are monitored,
  #     and what `treadmark footprint` reconstructs into service objects. ---
  - HKLM\System\CurrentControlSet\Services

  # --- Logon / injection hijacks ---
  - HKLM\Software\Microsoft\Windows NT\CurrentVersion\Winlogon
  - HKLM\Software\Microsoft\Windows NT\CurrentVersion\Image File Execution Options
  - HKLM\Software\Microsoft\Windows NT\CurrentVersion\Windows          # AppInit_DLLs
  - HKLM\Software\Wow6432Node\Microsoft\Windows NT\CurrentVersion\Windows
  - HKLM\Software\Microsoft\Windows\CurrentVersion\Explorer\Browser Helper Objects

  # --- Policy and authentication ---
  - HKLM\Software\Microsoft\Windows\CurrentVersion\Policies
  - HKLM\Software\Policies
  - HKLM\System\CurrentControlSet\Control\Lsa
  - HKLM\System\CurrentControlSet\Control\SecurityProviders

registry_recursive: true
# The Services subtree is deep and wide; bound the recursion so a scan stays
# fast. Depth 3 reaches each service's key plus its Parameters — enough for
# identity (ImagePath/Start/ObjectName) without walking every nested blob.
registry_max_depth: 3
registry_exclude: []          # substring match against the full key path

# Value-name-level excludes: unmonitor single churny values without giving
# up the rest of the key. Each entry has `value` (exact value name,
# case-insensitive; use "(Default)" for a key's default value) and an
# optional `key` (case-insensitive substring of the full key path, same
# semantics as registry_exclude; omit it to match the value name under
# every monitored key).
#
# LsaPid ships excluded: it is the PID of lsass.exe, new on every boot,
# while the rest of Control\Lsa (authentication package lists) is exactly
# why the key is watched.
#
# NOTE: adding an exclude on a host that already has a baseline reports the
# value as *deleted* once (it is in the baseline but no longer walked).
# Accept it one time with `treadmark registry update`, or rebuild the baseline.
registry_exclude_values:
  - key: CurrentControlSet\Control\Lsa
    value: LsaPid

  # --- Golden-image / cloned-fleet churn: these differ per clone or per
  #     boot and drown the signal when many clones scan against one golden
  #     baseline. Uncomment for cloned fleets; on a single pet host they
  #     are legitimate (if low-value) tamper surface, so they ship watched. ---
  # - key: Services\LanmanServer\Parameters
  #   value: Guid                    # regenerated each boot
  # - key: Services\Tcpip\Parameters
  #   value: Hostname                # per-clone identity
  # - key: Services\Tcpip\Parameters
  #   value: NV Hostname

registry_skip_volatile: true  # don't flag perf-counter / volatile churn

# Store gzipped content of small text files in the baseline so `treadmark files
# scan` shows unified diffs of changed configs. On Windows the baseline DB is
# ACL-locked to Administrators/SYSTEM (see the MSI's DataDir permissions).
# Most Program Files content is binary, so content capture is smaller here
# than on a Linux /etc; still useful for the hosts file and text configs.
store_content: true
store_content_max_kb: 256

# Which file changes a scan reports. Unset = everything (content, mode,
# owner/group, ACL, mtime). On golden-image clones the Task Scheduler
# re-registers every task at first boot, touching mtime across most of
# C:\Windows\System32\Tasks without changing a byte — churn that drowns the
# persistence signal. Uncomment to keep watching those trees for real
# changes (content + ACL/owner) while ignoring timestamp-only drift.
# Trade-off: timestomping (an mtime change with no content change) is then
# no longer reported.
# compare_fields: [sha256, size, mode, owner, group, acl]

# Optional report output — see docs/output-formats.md.
# report:
#   path: C:\ProgramData\Treadmark\reports\latest.json
#   format: json
