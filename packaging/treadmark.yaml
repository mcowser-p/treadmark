# /etc/treadmark/treadmark.yaml — default config, edit before first run
#
# The exclude list below is tuned for the forensic single-host default:
# suppress files that churn on their own (package-manager bookkeeping,
# caches, regenerated artifacts) while keeping classic tamper targets
# (/etc/hosts, CA bundles, host keys, the kernel image) watched.
#
# NOTE: if you tighten this list on a host that already has a baseline,
# the next scan reports newly-excluded paths as *deleted* once (they are in
# the baseline but no longer walked). Accept them one time with:
#   treadmark files update --accept <path> ...
db_path: /var/lib/treadmark/baseline.db

paths:
  - /etc
  - /bin
  - /sbin
  - /usr/bin
  - /usr/sbin
  # Unpackaged binaries land here — classic drop location:
  - /usr/local/bin
  - /usr/local/sbin
  # Vendor systemd tree: units, generators, system-sleep/shutdown hooks —
  # all persistence vectors. (/etc/systemd is covered by /etc above;
  # /lib/systemd is the usr-merge alias of this on modern distros;
  # /run/systemd is runtime-transient, not persistent state.)
  - /usr/lib/systemd
  # Per-user crontabs:
  - /var/spool/cron
  # Third-party applications and user-reachable persistence
  # (~/.ssh/authorized_keys, shell rc files):
  - /opt
  - /home
  - /root
  - /boot

exclude:
  # --- Runtime state rewritten by the OS itself (not authored by anyone) ---
  - /etc/mtab
  - /etc/mtab.fuselock
  - /etc/resolv.conf          # DHCP / systemd-resolved rewrite this constantly.
                              # If your fleet uses static resolvers, comment
                              # this out to catch DNS hijacks.
  - /etc/ld.so.cache          # regenerated by ldconfig, not authored
  - /etc/adjtime              # NTP writes this
  - /etc/.pwd.lock

  # --- Package-manager bookkeeping (changes on every apt/dnf/yum run).
  #     Dormant under the default paths above; kept here so widening
  #     `paths:` to /var doesn't flood the baseline. ---
  - /var/lib/dpkg/
  - /var/lib/apt/
  - /var/lib/rpm/
  - /var/lib/dnf/
  - /var/lib/yum/
  - /var/lib/PackageKit/
  - /var/lib/snapd/
  - /var/lib/man-db/
  - /var/lib/systemd/
  - /var/cache/

  # --- Logs and scratch (never a baseline target) ---
  - /var/log
  - /tmp
  - /run/
  - __pycache__

  # --- Backup / temp droppings left by package tools and editors ---
  - .dpkg-old
  - .dpkg-new
  - .dpkg-dist
  - .rpmnew
  - .rpmsave
  - .ucf-old
  - .ucf-new

  # --- Initramfs images: regenerated on every kernel update, huge, and
  #     not diffable. The kernel image itself (/boot/vmlinuz*) and
  #     System.map stay WATCHED — kernel replacement is exactly what a
  #     forensic FIM must catch. ---
  - /boot/initrd
  - /boot/initramfs

  # --- Home-directory noise (applies under /home and /root). Deliberately
  #     minimal: shell rc files, ~/.ssh, and shell history stay WATCHED —
  #     rc-file persistence and history wiping are tamper indicators.
  #     Interactive workstations may need more here; servers rarely do. ---
  - /.cache/
  - /.local/share/Trash/
  - /snap/

  # --- Deliberately NOT excluded (classic tamper targets — leave watched):
  #     /etc/hosts               hosts-file redirection is a textbook attack
  #     /etc/ssl/certs/          rogue CA insertion
  #     /etc/ca-certificates/    (churns only on package updates)
  #     /etc/machine-id          stable after provisioning
  #     /etc/hostname            hostname change is forensically interesting
  #     /etc/ssh/ssh_host_       host-key swap = possible MITM
  #     /etc/cloud/              user-data persistence is an attack vector

  # --- Golden-baseline / cross-host compares: uncomment this block when
  #     this config feeds `treadmark compare against` across machines or OS
  #     images. These are per-host identity files — legitimate forensic
  #     watch targets on a single host, pure noise when diffing host A
  #     against golden image B. See docs/golden-baseline-workflow.md. ---
  # - /etc/machine-id
  # - /var/lib/dbus/machine-id
  # - /etc/hostname
  # - /etc/hosts
  # - /etc/ssh/ssh_host_
  # - /etc/cloud/
  # - /var/lib/cloud/
  # - /etc/vconsole.conf

exclude_extensions: [.log, .tmp, .swp, .swo, .pyc, .pyo]
# Deliberately NOT excluded: .gz (would blind the FIM to tarball drops in
# watched dirs), .lock/.pid (don't appear under the default paths).

follow_symlinks: false
hash_algorithm: sha256
max_file_size_mb: 500

# Store gzipped content of small text files in the baseline. When enabled,
# `treadmark files scan` shows unified diffs for changed config files instead
# of just "sha256 changed" — invaluable for forensic investigation.
#
# Caveat: the baseline DB then contains snapshots of monitored files. The
# DB is mode 0700 root-only on Linux and ACL-locked on Windows, but this
# can mean storing sensitive config (secrets, keys) in the baseline —
# especially with /home and /root watched: dotfiles and SSH private keys
# are small enough to be captured. Treat the baseline DB itself as
# sensitive, or set false to disable content capture.
store_content: true
store_content_max_kb: 256   # don't store text files larger than this

# Optional report output. If `path` is set, every `treadmark files scan` writes
# a report file in addition to printing terminal output. Format is auto-
# detected from the extension (json/ndjson/csv/sarif/md/html/txt) or override
# with `format`. The CLI flags --report and --format override these.
#
# report:
#   path: /var/lib/treadmark/reports/latest.json
#   format: json     # optional; inferred from path extension
