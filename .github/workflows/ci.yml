# .github/workflows/ci.yml
#
# Runs on every PR. Same builds as release.yml but without the publish step
# — catches packaging breakage before it merges.
#
# Note: this does NOT run on push to main. The release workflow already
# builds artifacts on main; running CI there too would be duplicated work.

name: ci

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor from pyproject's requires-python; 3.13 the ceiling.
        os: [ubuntu-latest]
        python-version: ['3.9', '3.12', '3.13']
        # Windows runs the suite once (the Windows-only registry tests only
        # execute here); pywin32 comes via the `windows` extra.
        include:
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: install windows extra
        if: runner.os == 'Windows'
        run: pip install -e ".[windows]"
      - run: pytest

  linux:
    needs: test
    runs-on: ubuntu-latest
    # Build inside the OLDEST supported glibc (EL9, 2.34): Nuitka binaries
    # take the build host's versioned glibc symbols, so building on the
    # runner's Ubuntu 24.04 (glibc 2.39) produced binaries that died on
    # Amazon Linux 2023 / EL9 with "GLIBC_2.38 not found". almalinux:9 sets
    # the floor; the smoke matrix below proves it on every target family.
    container: almalinux:9
    steps:
      - name: install build tooling (el9 container)
        run: |
          dnf install -qy epel-release          # dpkg (for dpkg-deb) lives in EPEL
          dnf install -qy python3.12 python3.12-pip python3.12-devel \
              gcc make dpkg rpm-build binutils file git-core
          # Build scripts call plain python3; EL9's default is 3.9.
          ln -sf /usr/bin/python3.12 /usr/local/bin/python3
      - uses: actions/checkout@v7
      - name: cache nuitka
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka
          key: nuitka-el9-x86_64
      - run: bash scripts/build-linux.sh
      - run: ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-x86_64
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
          # consumed by the smoke job in this same run; nothing needs it later
          retention-days: 1

  # Install the freshly built packages on real target distros and run a
  # full baseline cycle. Catches "binary won't load on the target" and
  # packaging regressions that unit tests can't see.
  smoke:
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'almalinux:10', 'amazonlinux:2023']
        # `name` is the artifact-safe form of `image` (no ':' allowed).
        include:
          - image: 'ubuntu:24.04'
            name: ubuntu-24.04
          - image: 'almalinux:10'
            name: almalinux-10
          - image: 'amazonlinux:2023'
            name: amazonlinux-2023
    container: ${{ matrix.image }}
    steps:
      # amazonlinux:2023 ships without tar/gzip, which actions/checkout needs
      # for its no-git tarball fallback (the ubuntu/almalinux images have them).
      - name: prepare amazonlinux container
        if: matrix.image == 'amazonlinux:2023'
        run: dnf install -qy tar gzip
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist-x86_64
          path: dist/
      - run: |
          DIST_DIR="$PWD/dist" FOOTPRINT_DIR="$PWD" \
            bash scripts/smoke-test.sh
      # The captured install footprints (nginx + apache) — what treadmark saw
      # each package do. Uploaded even on failure for debugging.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true   # diagnostics: never fail the build on them
        with:
          name: footprint-${{ matrix.name }}
          path: footprint-*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: footprint summary
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          fps=(footprint-*.json)
          [ ${#fps[@]} -eq 0 ] && exit 0
          {
            echo "### Footprint models — ${{ matrix.name }}"
            echo ""
            echo "| app | files+ | modified | risks |"
            echo "|---|---|---|---|"
            for f in "${fps[@]}"; do
              app=$(basename "$f" .json | sed 's/footprint-//')
              fa=$(grep -m1 '"files_added"'    "$f" | grep -oE '[0-9]+' | head -1)
              fm=$(grep -m1 '"files_modified"' "$f" | grep -oE '[0-9]+' | head -1)
              rk=$(grep -m1 '"risks"'          "$f" | grep -oE '[0-9]+' | head -1)
              echo "| $app | ${fa:-0} | ${fm:-0} | ${rk:-0} |"
            done
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  # Build the Windows exe + MSI and smoke-test it in ONE job (install →
  # files+registry cycle → uninstall). One runner, not two; WiX + pip cached.
  # Blocking on PRs.
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: cache wix toolset
        uses: actions/cache@v4
        with:
          path: |
            ~\.dotnet\tools
            ~\.wix
          key: wix-5.0.2
      - name: cache nuitka
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka
          key: nuitka-windows-x86_64
      - shell: pwsh
        run: scripts\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/treadmark-windows-x86_64.exe
            dist/*.msi
          if-no-files-found: error
          retention-days: 1
      - name: smoke-test the msi
        shell: pwsh
        run: scripts\smoke-test.ps1
      # Windows footprint models as a workflow artifact (the smoke script
      # also renders them into the job summary). Not a release asset.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true   # diagnostics: never fail the build on them
        with:
          name: footprint-windows
          path: footprint-windows-*.json
          if-no-files-found: ignore
          retention-days: 7
