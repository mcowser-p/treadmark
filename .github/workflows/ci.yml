# .github/workflows/ci.yml
#
# Runs on every PR. Same builds as release.yml but without the publish step
# — catches packaging breakage before it merges.
#
# Note: this does NOT run on push to main. The release workflow already
# builds artifacts on main; running CI there too would be duplicated work.

name: ci

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor from pyproject's requires-python; 3.13 the ceiling.
        python-version: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: bash scripts/build-linux.sh
      - run: ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-x86_64
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  # Install the freshly built packages on real target distros and run a
  # full baseline cycle. Catches "binary won't load on the target" and
  # packaging regressions that unit tests can't see.
  smoke:
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'almalinux:10']
        # `name` is the artifact-safe form of `image` (no ':' allowed).
        include:
          - image: 'ubuntu:24.04'
            name: ubuntu-24.04
          - image: 'almalinux:10'
            name: almalinux-10
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-x86_64
          path: dist/
      - run: |
          DIST_DIR="$PWD/dist" FOOTPRINT_DIR="$PWD" \
            bash scripts/smoke-test.sh
      # The captured install footprints (nginx + apache) — what cairn saw
      # each package do. Uploaded even on failure for debugging.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footprint-${{ matrix.name }}
          path: footprint-*.json
          if-no-files-found: ignore

  # Windows builds are disabled for the Linux-only release line.
  # Re-enable: uncomment this job (and the matching one in release.yml,
  # plus restore 'windows' in release.yml's attach.needs).
