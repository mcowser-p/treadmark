# .github/workflows/release.yml
#
# Triggered by every push to main. semantic-release decides whether a release
# is warranted (presence of feat:/fix:/BREAKING since the last tag), bumps the
# version, tags, and creates a GitHub Release. Build jobs then attach
# artifacts to that release.
#
# Flow:
#   1. release job: python-semantic-release analyzes commits, bumps version
#      in pyproject.toml, commits, tags, and creates the GH Release.
#   2. If released == true:
#        linux job builds wheel + binary + .deb + .rpm for x86_64 and arm64
#        windows job builds .exe + .msi
#   3. attach job downloads all artifacts, generates SHA256SUMS, uploads
#      everything to the GH Release.
#
# semantic-release's release commit is tagged with [skip ci] so it doesn't
# loop on itself.

name: release

on:
  push:
    branches: [main]

permissions:
  contents: write     # semantic-release needs to push tags + commit
  issues: write       # for releases that close issues via "Closes #123"
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false   # never cancel a release mid-flight

jobs:
  # =========================================================================
  # 0. Tests gate the release job itself, not just the builds: semantic-release
  #    tags and publishes the GitHub Release in step 1, and a tag from a broken
  #    commit cannot be un-published cleanly.
  # =========================================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: pytest

  # =========================================================================
  # 1. Decide if a release is warranted; if so, tag and create GH Release.
  # =========================================================================
  release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.semrel.outputs.released }}
      version:  ${{ steps.semrel.outputs.version }}
      tag:      ${{ steps.semrel.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # semantic-release needs the full history to analyze commits
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run python-semantic-release
        id: semrel
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize
        run: |
          echo "released: ${{ steps.semrel.outputs.released }}"
          echo "version:  ${{ steps.semrel.outputs.version }}"
          echo "tag:      ${{ steps.semrel.outputs.tag }}"

  # =========================================================================
  # 2a. Build Linux artifacts at the new version.
  # =========================================================================
  linux:
    needs: release
    if: needs.release.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the commit semantic-release just made — it has the
          # bumped version in pyproject.toml.
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: build wheel + binary + deb + rpm
        run: bash scripts/build-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.whl
            dist/cairn-linux-${{ matrix.arch }}
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  # =========================================================================
  # 2a½. Smoke-test the freshly built packages on real target distros,
  # both architectures. Gates the attach job: a package that won't install
  # or run on Ubuntu 24.04 / AlmaLinux 10 never reaches the GitHub Release.
  # =========================================================================
  smoke:
    needs: [release, linux]
    if: needs.release.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'almalinux:10']
        arch: [x86_64, aarch64]
        # `name` is the artifact-safe form of `image` (no ':' allowed).
        include:
          - image: 'ubuntu:24.04'
            name: ubuntu-24.04
          - image: 'almalinux:10'
            name: almalinux-10
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/
      - run: |
          # SMOKE_EXTENDED: releases run the full enterprise/dev package
          # set; PR CI runs only the core web/db set for speed.
          DIST_DIR="$PWD/dist" FOOTPRINT_DIR="$PWD" SMOKE_EXTENDED=1 \
            bash scripts/smoke-test.sh
      # The captured install footprints (nginx + apache) — what cairn saw
      # each package do. Uploaded even on failure for debugging.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footprint-${{ matrix.name }}-${{ matrix.arch }}
          path: footprint-*.json
          if-no-files-found: ignore
      # Render the captured footprints into the job summary (counts per app).
      - name: footprint summary
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          fps=(footprint-*.json)
          [ ${#fps[@]} -eq 0 ] && exit 0
          {
            echo "### Footprint models — ${{ matrix.name }} ${{ matrix.arch }}"
            echo ""
            echo "| app | files+ | modified | risks |"
            echo "|---|---|---|---|"
            for f in "${fps[@]}"; do
              app=$(basename "$f" .json | sed 's/footprint-//')
              fa=$(grep -m1 '"files_added"'    "$f" | grep -oE '[0-9]+' | head -1)
              fm=$(grep -m1 '"files_modified"' "$f" | grep -oE '[0-9]+' | head -1)
              rk=$(grep -m1 '"risks"'          "$f" | grep -oE '[0-9]+' | head -1)
              echo "| $app | ${fa:-0} | ${fm:-0} | ${rk:-0} |"
            done
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # 2b. Build Windows artifacts at the new version, then smoke-test the MSI.
  #
  # SOAK: this job is continue-on-error while the Windows pipeline is young
  # — a Windows flake must not hold Linux release artifacts hostage. The
  # attach job downloads ALL artifacts, so Windows artifacts attach
  # opportunistically when green and are simply absent when not.
  # To flip to BLOCKING once proven: drop the `continue-on-error` line and
  # add `windows` to attach.needs below.
  #
  # Org strings + License.rtf in windows/ are still placeholders (SETUP.md
  # pre-publish TODO) — the MSI installs but isn't brand-correct yet.
  # =========================================================================
  # Build the exe + MSI and smoke-test it in ONE job — a second windows-latest
  # runner (spin-up + checkout + artifact round-trip) is far slower than the
  # build itself. WiX tool and pip are cached across runs.
  windows:
    needs: release
    if: needs.release.outputs.released == 'true'
    continue-on-error: true   # SOAK — see note above
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: cache wix toolset
        uses: actions/cache@v4
        with:
          path: |
            ~\.dotnet\tools
            ~\.wix
          key: wix-5.0.2
      - name: build binary + msi
        shell: pwsh
        run: scripts\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            dist/cairn-windows-x86_64.exe
            dist/*.msi
          if-no-files-found: error
      - name: smoke-test the msi
        shell: pwsh
        run: scripts\smoke-test.ps1
      # Windows footprint models (IIS, and Datadog if winget worked) as a
      # WORKFLOW artifact + rendered into the job summary by the smoke script.
      # Named footprint-* so the release attach step excludes them.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footprint-windows
          path: footprint-windows-*.json
          if-no-files-found: ignore

  # =========================================================================
  # 3. Attach all artifacts to the GitHub Release semantic-release created.
  # =========================================================================
  attach:
    # SOAK: 'windows' intentionally NOT in needs — it's continue-on-error, so
    # gating attach on it would defeat the soak. Add it here (and drop its
    # continue-on-error) once Windows is proven.
    needs: [release, linux, smoke]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: flatten + checksum
        run: |
          mkdir -p release/
          # Release deliverables only. Skip footprint-*.json (smoke-debug
          # artifacts, duplicated across every distro×arch matrix leg — they'd
          # collide flattening into one dir). Copy per file with overwrite so
          # the arch-independent wheel, uploaded by both Linux arch jobs,
          # de-dupes cleanly instead of erroring on a just-created collision.
          find artifacts/ -type f ! -name 'footprint-*.json' -print0 \
            | while IFS= read -r -d '' f; do
                cp -f "$f" "release/$(basename "$f")"
              done
          cd release/
          sha256sum * > SHA256SUMS
          ls -la

      # Optional GPG signing of the checksums file. Skipped silently if the
      # secret is absent; uncomment / configure once you have the key set up.
      - name: sign SHA256SUMS
        if: env.RELEASE_GPG_KEY != ''
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
        run: |
          echo "$RELEASE_GPG_KEY" | gpg --batch --import
          gpg --batch --yes --detach-sign --armor release/SHA256SUMS

      - name: upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: release/*
          fail_on_unmatched_files: true
