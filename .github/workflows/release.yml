# .github/workflows/release.yml
#
# Triggered by every push to main. Builds and smoke-tests the artifacts FIRST,
# and only creates the tag + GitHub Release once everything is green — so a
# broken build can never leave a published release (or even a consumed version
# number) behind.
#
# Flow:
#   test     unit tests gate everything (fail fast before spending build time).
#   version  compute the NEXT release version with no side effects
#            (semantic-release --print). No tag, no commit, no push.
#   linux /  build the artifacts, stamping that computed version into the
#   windows  working tree so .deb/.rpm/.msi + `treadmark --version` are correct.
#   smoke    install the freshly built packages on real distros / via the MSI.
#   release  ONLY now: semantic-release bumps pyproject, commits, tags, pushes,
#            and creates the GitHub Release.
#   attach   download all artifacts, checksum, upload to that release.
#
# If `version` finds no release is warranted, every downstream job is skipped.
# The release commit is tagged [skip ci] so it doesn't loop on itself.

name: release

on:
  push:
    branches: [main]

permissions:
  contents: write     # semantic-release needs to push tags + commit
  issues: write       # for releases that close issues via "Closes #123"
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false   # never cancel a release mid-flight

jobs:
  # =========================================================================
  # 0. Unit tests gate everything else — fail fast before any build minutes.
  # =========================================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: pytest

  # =========================================================================
  # 1. Decide the next version WITHOUT any side effects. semantic-release
  #    --print computes the version the accumulated commits warrant; nothing
  #    is committed, tagged, or pushed here. The build jobs consume this so
  #    they can stamp the right version BEFORE the tag exists.
  # =========================================================================
  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.compute.outputs.released }}
      version:  ${{ steps.compute.outputs.version }}
      tag:      ${{ steps.compute.outputs.tag }}
      pyver:    ${{ steps.compute.outputs.pyver }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # full history for commit analysis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "python-semantic-release>=10,<11"
      - name: compute next version
        id: compute
        run: |
          # Both --print flags are pure (no writes). A release is warranted
          # iff the next version differs from the last released one.
          next=$(semantic-release version --print 2>/dev/null || true)
          last=$(semantic-release version --print-last-released 2>/dev/null || true)
          echo "next='$next'  last='$last'"
          if [ -n "$next" ] && [ "$next" != "$last" ]; then
            echo "released=true"   >> "$GITHUB_OUTPUT"
            echo "version=$next"   >> "$GITHUB_OUTPUT"
            echo "tag=v$next"      >> "$GITHUB_OUTPUT"
          else
            echo "released=false"  >> "$GITHUB_OUTPUT"
            echo "No release warranted — downstream jobs will skip."
          fi
          # The version already stamped in pyproject. A release only fires
          # when this matches the computed next version — i.e. the release
          # PR that stamps it has been merged (main is PR-protected).
          pyver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "pyver=$pyver" >> "$GITHUB_OUTPUT"

  # =========================================================================
  # 2a. Build Linux artifacts at the computed version (both architectures).
  # =========================================================================
  linux:
    needs: version
    if: needs.version.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Build inside the OLDEST supported glibc (EL9, 2.34): Nuitka binaries
    # take the build host's versioned glibc symbols, so building on the
    # runner's Ubuntu 24.04 (glibc 2.39) produced binaries that died on
    # Amazon Linux 2023 / EL9 with "GLIBC_2.38 not found". almalinux:9 sets
    # the floor; the smoke matrix proves it on every target family.
    container: almalinux:9
    steps:
      - name: install build tooling (el9 container)
        run: |
          dnf install -qy epel-release          # dpkg (for dpkg-deb) lives in EPEL
          dnf install -qy python3.12 python3.12-pip python3.12-devel \
              gcc make dpkg rpm-build binutils file git-core
          # Build scripts call plain python3 (and the stamp step below calls
          # python); EL9's default python3 is 3.9.
          ln -sf /usr/bin/python3.12 /usr/local/bin/python3
          ln -sf /usr/bin/python3.12 /usr/local/bin/python
      - uses: actions/checkout@v7

      # No tag exists yet — stamp the computed version into the working tree
      # so the .deb/.rpm metadata and `treadmark --version` report it.
      - name: stamp the release version
        run: python scripts/stamp_version.py "${{ needs.version.outputs.version }}"

      # Nuitka compiles C — cache its work dir so warm builds are fast.
      - name: cache nuitka
        uses: actions/cache@v6
        with:
          path: ~/.cache/Nuitka
          key: nuitka-el9-${{ matrix.arch }}

      # No wheel: a wheel is a zip of the literal source; publishing it
      # would defeat the compiled (Nuitka) binaries.
      - name: build binary + deb + rpm
        run: bash scripts/build-linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          retention-days: 1
          path: |
            dist/treadmark-linux-${{ matrix.arch }}
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  # =========================================================================
  # 2b. Build the Windows exe + MSI at the computed version, then smoke-test
  # the MSI — all in ONE job (a second windows-latest runner is far slower
  # than the build itself). WiX + pip cached across runs.
  #
  # Windows is now a FIRST-CLASS release gate: if this job fails, no release
  # is cut. (Soak over — it previously ran continue-on-error.)
  #
  # Org strings + License.rtf in windows/ are still placeholders (SETUP.md
  # pre-publish TODO) — the MSI installs but isn't brand-correct yet.
  # =========================================================================
  windows:
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: cache wix toolset
        uses: actions/cache@v6
        with:
          path: |
            ~\.dotnet\tools
            ~\.wix
          key: wix-5.0.2
      - name: cache nuitka
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\Nuitka
          key: nuitka-windows-x86_64
      - name: stamp the release version
        shell: pwsh
        run: python scripts/stamp_version.py "${{ needs.version.outputs.version }}"
      - name: build binary + msi
        shell: pwsh
        run: scripts\build-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          retention-days: 1
          path: |
            dist/treadmark-windows-x86_64.exe
            dist/*.msi
          if-no-files-found: error
      - name: smoke-test the msi
        shell: pwsh
        env:
          # Releases also capture the extended app set (postgresql, chrome,
          # 7zip, podman, sqlexpress) for the Windows runbooks; PR CI runs
          # only the IIS+Datadog core for speed — same knob as the Linux smoke.
          SMOKE_EXTENDED: '1'
        run: scripts\smoke-test.ps1
      # Windows footprint models (IIS, and Datadog if winget worked) as a
      # WORKFLOW artifact + rendered into the job summary by the smoke script.
      # Named footprint-* so the release attach step excludes them.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: footprint-windows
          retention-days: 1
          path: footprint-windows-*.json
          if-no-files-found: ignore

  # =========================================================================
  # 2b½. Windows 11 (arm64) footprint captures — SOAK: first use of the
  # windows-11-arm runner (client OS + arm64; availability on private repos
  # assumed from the working ubuntu-24.04-arm jobs — this run confirms).
  # Captures the common-desktop app set (7zip, chrome, firefox, notepad++,
  # vscode, git, python, adobe reader, zoom, slack — incl. the per-user
  # %LOCALAPPDATA% install shape the Server captures can't show) via the
  # pip-installed package; no arm64 exe/MSI is built yet. continue-on-error:
  # a probe must not gate releases. NOT in release/attach needs; footprints
  # are workflow artifacts.
  # =========================================================================
  windows-11:
    needs: version
    if: needs.version.outputs.released == 'true'
    continue-on-error: true   # SOAK — see note above
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: install treadmark
        shell: pwsh
        run: |
          pip install -e .
          if ($LASTEXITCODE -ne 0) { throw "core install failed" }
          # pywin32 arm64 wheels power the owner/ACL enrichment; if absent,
          # files.py degrades gracefully (owner/acl null) — don't fail here.
          pip install -e ".[windows]"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "[i] pywin32 unavailable on arm64 - owner/acl will be omitted"
          }
      - name: desktop app footprints
        shell: pwsh
        run: scripts\win11-footprint.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: footprint-windows-11
          retention-days: 1
          path: footprint-windows11-*.json
          if-no-files-found: ignore

  # =========================================================================
  # 2c. Smoke-test the freshly built Linux packages on real target distros,
  # both architectures. Gates the release: a package that won't install or
  # run on Ubuntu 24.04 / AlmaLinux 10 never gets a tag.
  # =========================================================================
  smoke:
    needs: [version, linux]
    if: needs.version.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'almalinux:10', 'amazonlinux:2023']
        arch: [x86_64, aarch64]
        # `name` is the artifact-safe form of `image` (no ':' allowed).
        include:
          - image: 'ubuntu:24.04'
            name: ubuntu-24.04
          - image: 'almalinux:10'
            name: almalinux-10
          - image: 'amazonlinux:2023'
            name: amazonlinux-2023
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container: ${{ matrix.image }}
    steps:
      # amazonlinux:2023 ships without tar/gzip, which actions/checkout needs
      # for its no-git tarball fallback (the ubuntu/almalinux images have them).
      - name: prepare amazonlinux container
        if: matrix.image == 'amazonlinux:2023'
        run: dnf install -qy tar gzip
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.arch }}
          path: dist/
      - run: |
          # SMOKE_EXTENDED: releases run the full enterprise/dev package
          # set; PR CI runs only the core web/db set for speed.
          DIST_DIR="$PWD/dist" FOOTPRINT_DIR="$PWD" SMOKE_EXTENDED=1 \
            bash scripts/smoke-test.sh
      # The captured install footprints (nginx + apache) — what treadmark saw
      # each package do. Uploaded even on failure for debugging.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: footprint-${{ matrix.name }}-${{ matrix.arch }}
          retention-days: 1
          path: footprint-*.json
          if-no-files-found: ignore
      # Render the captured footprints into the job summary (counts per app).
      - name: footprint summary
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          fps=(footprint-*.json)
          [ ${#fps[@]} -eq 0 ] && exit 0
          {
            echo "### Footprint models — ${{ matrix.name }} ${{ matrix.arch }}"
            echo ""
            echo "| app | files+ | modified | risks |"
            echo "|---|---|---|---|"
            for f in "${fps[@]}"; do
              app=$(basename "$f" .json | sed 's/footprint-//')
              fa=$(grep -m1 '"files_added"'    "$f" | grep -oE '[0-9]+' | head -1)
              fm=$(grep -m1 '"files_modified"' "$f" | grep -oE '[0-9]+' | head -1)
              rk=$(grep -m1 '"risks"'          "$f" | grep -oE '[0-9]+' | head -1)
              echo "| $app | ${fa:-0} | ${fm:-0} | ${rk:-0} |"
            done
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # 3. Everything is green — NOW create the release. semantic-release bumps
  #    pyproject, commits [skip ci], tags, pushes, and creates the GitHub
  #    Release (empty; assets are attached in the next job).
  # =========================================================================
  release:
    needs: [version, linux, windows, smoke]
    # Releases are PR-gated: main's ruleset forbids direct pushes, so the
    # version bump + changelog land via a release PR. Only once that PR is
    # merged (pyproject stamp == computed next version) does this job tag.
    if: needs.version.outputs.released == 'true' && needs.version.outputs.version == needs.version.outputs.pyver
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.semrel.outputs.released }}
      tag:      ${{ steps.semrel.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run python-semantic-release
        id: semrel
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # main is PR-protected: never commit/push the bump from CI. The
          # release PR already stamped the version; this only creates the
          # tag and the GitHub release (tags are outside the branch ruleset).
          commit: "false"
          changelog: "false"

      - name: Summarize
        run: |
          echo "released: ${{ steps.semrel.outputs.released }}"
          echo "version:  ${{ steps.semrel.outputs.version }}"
          echo "tag:      ${{ steps.semrel.outputs.tag }}"

  # =========================================================================
  # 4. Attach all artifacts to the GitHub Release. Both Linux AND Windows
  #    builds are attached now (Windows soak is over).
  # =========================================================================
  attach:
    needs: [linux, windows, release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: flatten + checksum
        run: |
          mkdir -p release/
          # Release deliverables only. Skip footprint-*.json (smoke-debug
          # artifacts, duplicated across every distro×arch matrix leg — they'd
          # collide flattening into one dir). Copy per file with overwrite so
          # any same-named file across artifacts de-dupes cleanly instead of
          # erroring on a just-created collision. (No wheel is attached — a
          # wheel is literal source; the binaries are Nuitka-compiled.)
          find artifacts/ -type f ! -name 'footprint-*.json' -print0 \
            | while IFS= read -r -d '' f; do
                cp -f "$f" "release/$(basename "$f")"
              done
          cd release/
          sha256sum * > SHA256SUMS
          ls -la

      # Optional GPG signing of the checksums file. Skipped silently if the
      # secret is absent; uncomment / configure once you have the key set up.
      - name: sign SHA256SUMS
        if: env.RELEASE_GPG_KEY != ''
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
        run: |
          echo "$RELEASE_GPG_KEY" | gpg --batch --import
          gpg --batch --yes --detach-sign --armor release/SHA256SUMS

      - name: upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: release/*
          fail_on_unmatched_files: true

  # =========================================================================
  # 5. Publish sdist + wheel to PyPI via Trusted Publishing (OIDC — no
  #    token secret; the pending publisher on pypi.org authorizes this
  #    repo + workflow). Binaries (.deb/.rpm/.msi) remain the primary
  #    channel; this adds `pip install treadmark`.
  # =========================================================================
  pypi:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
